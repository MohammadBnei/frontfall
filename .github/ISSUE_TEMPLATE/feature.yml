name: Feature proposal
description: Suggest a change to the game or the tooling.
labels: ["type: feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, [Discussions](https://github.com/nic0lasm/frontfall/discussions/categories/ideas) is the better place to start. Use this form when the change is concrete enough to be built.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, from a player's or contributor's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
