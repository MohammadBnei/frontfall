name: CI

on:
  pull_request:
  # Every branch, so a commit is known to be green before main is fast-forwarded to it.
  # Dependabot branches are covered by their pull request run.
  push:
    branches-ignore: ["dependabot/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # A full game on a World-sized map, failing if the tick misses its budget (docs/performance.md).
      - run: pnpm sim -- --width 2048 --height 1024 --players 16 --ticks 3000 --interval 10 --budget 30

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frontfall/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      # The built game at / and behind a proxy that serves it under /frontfall/.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results
          retention-days: 7

  clean-room:
    name: Clean room
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REFERENCE: https://github.com/openfrontio/OpenFrontIO.git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetched outside the workspace on every run: the reference never enters the repository or an image.
      - run: git clone --quiet --depth 1 "$REFERENCE" "$RUNNER_TEMP/reference"
      - name: Compare with the reference codebase
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            pnpm clean-room --reference "$RUNNER_TEMP/reference" --base "$BASE_SHA"
          else
            pnpm clean-room --reference "$RUNNER_TEMP/reference"
          fi
      - if: always()
        run: rm -rf "$RUNNER_TEMP/reference"
