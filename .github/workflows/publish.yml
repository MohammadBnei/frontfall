name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      now:
        description: Deploy without waiting for the games in progress to end
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SITE: https://nclsmgr.com/frontfall/

jobs:
  # Each architecture builds on a native runner, then is scanned before any tag is set.
  image:
    name: Image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Pushed by digest only: nothing is tagged before the scan passes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: FRONTFALL_VERSION=${{ steps.version.outputs.commit }}
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The digest names an index (image and attestations): pick the architecture.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    name: Tag the multi-arch image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest and set the tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: digests
        # Every build is tagged with its commit; main also moves latest, a v1.2.3 tag adds 1.2.3.
        run: |
          tags=(-t "$IMAGE:$TAG")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(-t "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:${GITHUB_REF_NAME#v}"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"

  deploy:
    name: Deploy
    needs: manifest
    # Releases are tagged from commits already deployed from main.
    if: vars.DEPLOIEMENT_ACTIF == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # A restart stops the games in progress. Wait for them to end, up to 20 minutes.
      - name: Wait for the games in progress
        if: ${{ !inputs.now }}
        run: |
          deadline=$((SECONDS + 20 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            running=$(curl -fsS "${SITE}api/games" | jq -r '.running // 0') || running=0
            if [ "$running" = 0 ]; then
              echo "No game in progress"
              exit 0
            fi
            echo "$running game(s) in progress, waiting"
            sleep 30
          done
          echo "::warning::Games still in progress after 20 minutes; deploying anyway"
      - name: Roll out the new image
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.manifest.outputs.tag }}
        # The key only allows a forced command on the server, which reads the tag and nothing else.
        run: |
          ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "frontfall@${HOST}" "$TAG" < /dev/null
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy
      - name: Wait for the new version to answer
        env:
          TAG: ${{ needs.manifest.outputs.tag }}
        run: |
          for _ in $(seq 12); do
            version=$(curl -fsS -o /dev/null -D - "${SITE}healthz" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-frontfall-version" { print $2 }') || true
            if [ "$version" = "$TAG" ]; then
              echo "${SITE} serves $TAG"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${SITE}healthz does not report $TAG after 60 s (last answer: ${version:-none})"
          exit 1

  smoke:
    name: Smoke test in production
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @frontfall/e2e
      - run: pnpm --filter @frontfall/e2e exec playwright install --with-deps chromium
      # Loads the live page through Cloudflare and plays on a real WebSocket.
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ env.SITE }}
